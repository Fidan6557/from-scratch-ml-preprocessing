[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-preprocessing-from-scratch"
version = "0.1.0"
description = "From-scratch NumPy implementations of common ML preprocessing algorithms"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Fidan Baghirova"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "pandas>=2.1",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "jupyter>=1.0",
]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ml_preprocessing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
